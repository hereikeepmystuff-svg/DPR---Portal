# Builds the DPR Portal Android app (an APK) from the portal's demo build.
#
#   Every push to main, every pull request, or "Run workflow" by hand:
#       the APK is attached to the run as an artifact (Actions tab -> the run -> Artifacts).
#   A version tag (v2.4, v2.4.1 ...) or a published GitHub release:
#       the APK is also attached to that release, as a direct download for phones, together with
#       the portal itself as one offline HTML file (dpr_portal_vX.Y.html).
#
# Signing: add the four ANDROID_* secrets described in docs/android.md so every build is signed with
# the same key and installs over the last one. Without them the APK is signed with a temporary key:
# fine for trying the app, but don't install it on site phones (see docs/android.md).

name: Android app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # one build per branch or tag: a newer push replaces a build still running, and a release
  # published together with its tag builds once
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: App web layer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the portal and pack it for the app
        run: |
          python3 tools/build.py --seed src/seeds/demo.json --out build/portal.html
          python3 android/prepare_assets.py build/portal.html android/app/src/main/assets/www

      - name: Check the packing (offline)
        run: python3 tests/android_assets.py

      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Check the bridge at phone, tablet and landscape sizes
        env:
          DPR_SHOTS: build/screenshots
        run: python3 tests/android_bridge.py

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: Build the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # to attach the APK to a release
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the portal and pack it for the app
        # fonts and the Excel library are downloaded into the app so it works offline
        run: |
          python3 tools/build.py --seed src/seeds/demo.json --out build/portal.html
          python3 android/prepare_assets.py build/portal.html android/app/src/main/assets/www

      - name: Version
        id: ver
        # name: the portal version and this workflow's run number, e.g. "2.3 (build 57)"
        # code: minutes since 2026, so every build installs over any earlier one
        run: |
          v=$(sed -n "s/.*const APP_VERSION = '\([^']*\)'.*/\1/p" src/portal.template.html | head -n 1)
          test -n "$v"
          echo "portal=$v" >> "$GITHUB_OUTPUT"
          echo "name=$v (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          echo "code=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_OUTPUT"
          echo "file=DPR-Portal-v$v-build${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic   # the open-source cache, on actions/cache

      - name: Signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DPR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: No signing key
        if: env.KEYSTORE_B64 == ''
        run: echo "::warning title=Temporary signing key::This APK is signed with a temporary key. Install it to try the app, not on site phones. Add the ANDROID_* secrets (docs/android.md) so updates install over earlier versions."

      - name: Keep the temporary key between builds
        if: env.KEYSTORE_B64 == ''
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build
        working-directory: android
        env:
          DPR_VERSION_NAME: ${{ steps.ver.outputs.name }}
          DPR_VERSION_CODE: ${{ steps.ver.outputs.code }}
          DPR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DPR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DPR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the files
        # the APK, and for releases the portal itself under its versioned name (dpr_portal_vX.Y.html)
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ steps.ver.outputs.file }}"
          cp build/portal.html "out/dpr_portal_v${{ steps.ver.outputs.portal }}.html"
          ls -l out
          {
            echo "**APK:** \`${{ steps.ver.outputs.file }}\` (version ${{ steps.ver.outputs.name }}, code ${{ steps.ver.outputs.code }})"
            echo
            if [ -n "$KEYSTORE_B64" ]; then echo "Signed with the project's release key."; else echo "Signed with a temporary key: for trying the app only."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.ver.outputs.file }}
          archive: false   # the APK itself, named after the file, not a zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.apk
            out/*.html
          fail_on_unmatched_files: true
